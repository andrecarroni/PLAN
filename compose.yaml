name: p4rebuild
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: p4
      POSTGRES_DB: p4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute python3 scripts/configure.py}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - p4-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p4 -d p4"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    image: p4-consultores:rebuild
    build:
      context: .
      secrets: [proxy_ca, ca_bundle]
    environment:
      DATABASE_URL: postgresql+psycopg://p4:${POSTGRES_PASSWORD}@db:5432/p4
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: p4-consultores:rebuild
    build:
      context: .
      secrets: [proxy_ca, ca_bundle]
    environment:
      DATABASE_URL: postgresql+psycopg://p4:${POSTGRES_PASSWORD}@db:5432/p4
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "127.0.0.1:${P4_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
secrets:
  proxy_ca:
    file: ${P4_PROXY_CA:-/etc/ssl/certs/ca-certificates.crt}
  ca_bundle:
    file: ${P4_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
volumes:
  p4-data:
